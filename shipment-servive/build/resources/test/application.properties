# Fast, isolated in-memory database for tests. random.uuid ensures each distinct Spring test
# context (e.g. @DataJpaTest vs @SpringBootTest, which use different auto-configuration and so
# get different cached contexts) gets its own database rather than accidentally sharing state
# through H2's JVM-wide named in-memory database registry.
spring.datasource.url=jdbc:h2:mem:shipment-servive-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
