spring.application.name=shipment-servive

# Persistent embedded database: file-based H2, so stored events survive a service restart
# (a purely in-memory datasource would not). Stored under ./data relative to the working directory.
spring.datasource.url=jdbc:h2:file:./data/shipment-servive;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is created/kept in sync automatically for this exercise; a real system would use
# Flyway/Liquibase migrations instead (see NOTES.md).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Handy for local inspection during development: http://localhost:8080/h2-console
# (JDBC URL above, username sa, blank password)
spring.h2.console.enabled=true
